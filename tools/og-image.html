<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fuente de assets/og-image-v3.png</title>
<!--
  Fuente de la imagen de Open Graph. No se publica: la renderiza
  tools/build-og.ps1 con Edge headless a 1200×630 y de ahí sale el PNG.

  POR QUÉ TODO ESTÁ EN EL CUADRADO DEL MEDIO
  WhatsApp no muestra la imagen 1200×630 entera: recorta un cuadrado al centro.
  De los 1200px de ancho sobreviven x ∈ [285, 915] —y en la práctica un poco
  menos—, así que cualquier cosa que se salga de ahí llega cortada al celular.
  Todo el contenido vive dentro de un cuadrado de 520px centrado (x ∈ [340, 860]),
  que deja aire de sobra incluso en el recorte más ajustado que se vio.
  Las alas laterales llevan sólo fondo, para que la versión completa (Facebook,
  Twitter, WhatsApp Web) siga leyéndose intencional y no vacía.

  La tarjeta de WhatsApp ya imprime og:title y og:description como texto al lado
  de la miniatura, así que la imagen no repite la frase: sólo lleva la marca.

  QUÉ CAMBIÓ EN LA v3
  Sigue el mismo sistema que el sitio después del rediseño: la marca es el
  nombre y no una "J" en un cuadrado ámbar redondeado, el espinazo aparece como
  hairline vertical a la izquierda, y se fue el resplandor radial ámbar. La
  imagen tiene que parecerse a la página que abre.

  Para revisar la zona segura: agregar la clase "guides" al <body> y abrir el
  archivo en el navegador. Se dibuja el cuadrado encima. Hay que sacarla antes
  de generar el PNG final (build-og.ps1 lo hace desde el archivo tal cual está).
-->
<style>
  @font-face {
    font-family: 'Bricolage Grotesque';
    src: url('../assets/fonts/bricolage-grotesque-latin.woff2') format('woff2');
    font-weight: 300 800;
    font-style: normal;
  }
  @font-face {
    font-family: 'Hanken Grotesk';
    src: url('../assets/fonts/hanken-grotesk-latin.woff2') format('woff2');
    font-weight: 300 800;
    font-style: normal;
  }

  /* Mismos tokens que css/styles.css. Si allá cambia la paleta, acá también:
     no hay nada que los sincronice solo. */
  :root {
    --bg:    #0B0D10;
    --line:  #24404F;
    --text:  #E8E8EA;
    --muted: #9A9AA2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: 'Hanken Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .safe {
    position: relative;
    width: 520px;
    height: 520px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
    /* El espinazo del sitio, en chico. */
    border-left: 2px solid var(--line);
    padding-left: 56px;
  }

  .name {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: 76px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -.03em;
    color: var(--text);
  }

  .role {
    font-size: 27px;
    font-weight: 400;
    line-height: 1.3;
    color: var(--muted);
  }

  /* Regla de control, apagada por defecto. Ver el comentario de arriba. */
  .guides .safe { outline: 2px dashed rgba(255, 180, 84, .5); }
  .guides::after {
    content: '';
    position: absolute;
    top: 0;
    left: 285px;
    width: 630px;
    height: 630px;
    outline: 2px solid rgba(255, 90, 90, .55);
  }
</style>
</head>
<body>
  <div class="safe">
    <div class="name">Joaquín<br>Moas</div>
    <div class="role">Desarrollo web</div>
  </div>
</body>
</html>
