<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Joaquín Moas</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
<style>
  /* Mismo sistema que el resto del sitio: alineado a la izquierda y colgado del
     espinazo. El "404" va en gris y no en ámbar — el acento está racionado para
     los CTA, y acá el único que hay es el botón. */
  .nf {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .nf__code {
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 16vw, 7rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--muted);
    margin: 0 0 .75rem;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
  <main class="nf">
    <div class="container">
      <div class="spine">
        <p class="nf__code">404</p>
        <h1 class="section__title">Esta página no existe.</h1>
        <p class="lead">
          Puede que el enlace esté mal escrito o que la página ya no esté.
        </p>
        <p style="margin-top:2rem">
          <a class="btn btn--lg" href="/">Ir al inicio</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
